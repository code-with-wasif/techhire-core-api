spring:
  application:
    name: techhire-core-api

  jwt:
    secret: ${JWT_SECRET_KEY}
    issuer: tech-hire-api
    expiration-seconds: ${JWT_EXPIRY_SEC}

  datasource:
    url: ${POSTGRESQL_URL}
    username: ${POSTGRESQL_USERNAME}
    password: ${POSTGRESQL_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
      database-platform: org.hibernate.dialect.PostgreSQLDialect
      show-sql: true
      hibernate:
        ddl-auto: create
      properties:
        hibernate:
          format_sql: true


